<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisters Events Planners — Home</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body, html { height:100%; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; transition: background 0.3s, color 0.3s; }
body.dark-theme { background-color:#111; color:#f5d17a; }

.header-box { width:100%; background-color:#111; box-shadow:0 8px 25px rgba(0,0,0,0.7); position:relative; z-index:10; padding:1rem 0; }
.header-content { max-width:1200px; margin:0 auto; display:flex; flex-direction:column; align-items:center; }
.header-content img { max-width:200px; width:80%; border-radius:15px; margin-bottom:1rem; }

.main-nav { display:flex; justify-content:center; flex-wrap:wrap; gap:1rem; }
.main-nav .nav-link { color:#f5d17a; text-decoration:none; font-weight:600; padding:0.5rem 1rem; border-radius:10px; transition:all 0.3s; }
.main-nav .nav-link.active, .main-nav .nav-link:hover { color:#fff; background-color:rgba(245,209,122,0.2); }

/* Theme Toggle */
.theme-toggle { margin-left:10px; position:relative; width:40px; height:20px; display:inline-block; }
.theme-toggle input { display:none; }
.slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#ccc; transition:0.4s; border-radius:34px; }
.slider:before { position:absolute; content:""; height:16px; width:16px; left:2px; bottom:2px; background:white; transition:0.4s; border-radius:50%; }
input:checked + .slider { background:#f5d17a; }
input:checked + .slider:before { transform:translateX(20px); }

/* Slideshow */
.slideshow { position:fixed; top:0; left:0; width:100%; height:100%; overflow:hidden; z-index:-1; }
.slide { position:absolute; width:100%; height:100%; background-size:cover; background-position:center; opacity:0; transition:opacity 1s ease-in-out; }
.slide.active { opacity:1; }

/* MAIN CONTENT FIXED */
.content {
  position:relative;
  z-index:10;
  text-align:center;
  margin-top:140px;     /* push below header */
  margin-bottom:140px;  /* keeps buttons above footer */
  color:#f5d17a;
}

.content p, .content h1 { margin:1rem 0; text-shadow: 2px 2px 6px #111; }
.content h1 { font-size:2rem; }

.cta-row { display:flex; justify-content:center; flex-wrap:wrap; margin-top:1.2rem; }

.btn { display:inline-block; padding:0.6rem 1.5rem; margin:0.5rem; font-weight:bold; border-radius:25px; transition:all 0.3s; text-decoration:none; text-align:center; cursor:pointer; }
.btn-gold { background-color:#f5d17a; color:#111; border:2px solid #f5d17a; }
.btn-gold:hover { background-color:transparent; color:#f5d17a; }
.btn-outline { background-color:transparent; color:#f5d17a; border:2px solid #f5d17a; }
.btn-outline:hover { background-color:#f5d17a; color:#111; }

/* Footer stable */
.site-footer {
  position:fixed;
  bottom:0;
  width:100%;
  background-color:rgba(17,17,17,0.9);
  color:#f5d17a;
  text-align:center;
  padding:1rem 0;
  font-size:0.9rem;
  box-shadow:0 -3px 10px rgba(0,0,0,0.5);
}

@media(max-width:768px){
  .header-content img{ max-width:150px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header-box">
  <div class="header-content">
    <img src="images/sisters.jpg" alt="Sisters Events Planners">

    <nav class="main-nav">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="gallery.html" class="nav-link">Gallery</a>
      <a href="contact.html" class="nav-link">Contact</a>
      <a href="faq.html" class="nav-link">FAQ</a>

      <label class="theme-toggle">
        <input type="checkbox" id="themeSwitch">
        <span class="slider"></span>
      </label>
    </nav>
  </div>
</div>

<!-- Slideshow -->
<div class="slideshow">
  <div class="slide active" style="background-image:url('images/img1.jpg');"></div>
  <div class="slide" style="background-image:url('images/img2.jpg');"></div>
  <div class="slide" style="background-image:url('images/img3.jpg');"></div>
  <div class="slide" style="background-image:url('images/img4.jpg');"></div>
</div>

<!-- Main Content -->
<main class="content">
  <h1>Welcome to Sisters Events Planners</h1>
  <p>Your perfect event starts here. We make every memory unforgettable!</p>

  <div class="cta-row">
    <a class="btn btn-gold" href="https://wa.me/27718403160" target="_blank">WhatsApp</a>
    <a class="btn btn-outline" href="mailto:sistersdecor379@gmail.com">Email Us</a>
  </div>
</main>

<!-- Footer -->
<footer class="site-footer">
  © 2025 Sisters Events Planners™ - our business in memory making.
</footer>

<script>
/* Theme Switch */
const toggle = document.getElementById('themeSwitch');
toggle.addEventListener('change', function(){ document.body.classList.toggle('dark-theme'); });

/* Slideshow */
const slides = document.querySelectorAll('.slide');
let current = 0;
setInterval(() => {
  slides[current].classList.remove('active');
  current = (current + 1) % slides.length;
  slides[current].classList.add('active');
}, 3000);
</script>

</body>
</html>
