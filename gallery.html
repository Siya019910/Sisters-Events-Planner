<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisters Events Planners — Gallery</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body, html { height:100%; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

/* Dark theme */
body.dark-theme { background:#111; color:#f5d17a; }

/* Header */
.header-box {
  width:100%; background:#111;
  box-shadow:0 8px 25px rgba(0,0,0,0.7);
  padding:1rem 0; z-index:10; position:relative;
}
.header-content { max-width:1200px; margin:0 auto; text-align:center; }
.header-content img { width:160px; border-radius:15px; margin-bottom:1rem; }

.main-nav { display:flex; justify-content:center; flex-wrap:wrap; gap:1rem; }
.nav-link {
  color:#f5d17a; text-decoration:none; font-weight:600;
  padding:0.5rem 1rem; border-radius:10px; transition:0.3s;
}
.nav-link.active, .nav-link:hover { background:rgba(245,209,122,0.2); color:#fff; }

/* Dark theme toggle */
.theme-toggle { width:40px; height:20px; position:relative; }
.theme-toggle input { display:none; }
.slider {
  position:absolute; cursor:pointer; background:#ccc;
  top:0; bottom:0; left:0; right:0; border-radius:34px;
  transition:0.4s;
}
.slider:before {
  content:""; position:absolute; width:16px; height:16px;
  left:2px; bottom:2px; background:white; border-radius:50%;
  transition:0.4s;
}
input:checked + .slider { background:#f5d17a; }
input:checked + .slider:before { transform:translateX(20px); }

/* Background slideshow */
.slideshow {
  position:fixed; top:0; left:0; width:100%; height:100%;
  overflow:hidden; z-index:-1;
}
.slide {
  position:absolute; width:100%; height:100%;
  background-size:cover; background-position:center;
  opacity:0; transition:1s ease-in-out;
}
.slide.active { opacity:1; }

/* Content */
.gallery-container {
  max-width:1200px;
  margin:7rem auto 6rem auto;
  padding:1rem;
  text-align:center;
  color:#f5d17a;
}
.gallery-container h1 { font-size:2rem; margin-bottom:2rem; }

/* Month sections */
.month-block { margin-bottom:3rem; }
.month-title {
  font-size:1.7rem;
  margin-bottom:1.2rem;
  font-weight:700;
  text-shadow:2px 2px 6px #111;
}

/* Grid */
.media-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
  gap:1.5rem;
  justify-items:center;
}
.media-grid img,
.media-grid video {
  width:100%;
  max-width:350px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}

/* Footer */
.site-footer {
  position:relative;
  width:100%;
  background:rgba(17,17,17,0.95);
  color:#f5d17a;
  text-align:center;
  padding:1rem 0;
  font-size:0.9rem;
  box-shadow:0 -3px 10px rgba(0,0,0,0.5);
  margin-top:3rem;
}

@media(max-width:768px){
  .header-content img { width:130px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header-box">
  <div class="header-content">
    <img src="images/sisters.jpg" alt="Sisters Events Planners">

    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="gallery.html" class="nav-link active">Gallery</a>
      <a href="contact.html" class="nav-link">Contact</a>
      <a href="faq.html" class="nav-link">FAQ</a>

      <label class="theme-toggle">
        <input type="checkbox" id="themeSwitch">
        <span class="slider"></span>
      </label>
    </nav>
  </div>
</div>

<!-- Slideshow -->
<div class="slideshow">
  <div class="slide active" style="background-image:url('images/img1.jpg');"></div>
  <div class="slide" style="background-image:url('images/img2.jpg');"></div>
  <div class="slide" style="background-image:url('images/img3.jpg');"></div>
  <div class="slide" style="background-image:url('images/img4.jpg');"></div>
</div>

<!-- Gallery Content -->
<div class="gallery-container">
  <h1>Gallery</h1>

  <!-- Month Blocks -->
  <!-- OCTOBER 2025 -->
  <div class="month-block">
    <div class="month-title">October 2025</div>
    <div class="media-grid">
      <img src="images/oct_img1.jpg" alt="">
      <img src="images/oct_img2.jpg" alt="">
      <video controls src="videos/oct_vid1.mp4"></video>
      <video controls src="videos/oct_vid2.mp4"></video>
    </div>
  </div>

  <!-- NOVEMBER 2025 -->
  <div class="month-block">
    <div class="month-title">November 2025</div>
    <div class="media-grid">
      <img src="images/nov_img1.jpg" alt="">
      <img src="images/nov_img2.jpg" alt="">
      <video controls src="videos/nov_vid1.mp4"></video>
      <video controls src="videos/nov_vid2.mp4"></video>
    </div>
  </div>

  <!-- DECEMBER 2025 -->
  <div class="month-block">
    <div class="month-title">December 2025</div>
    <div class="media-grid">
      <img src="images/dec_img1.jpg" alt="">
      <img src="images/dec_img2.jpg" alt="">
      <video controls src="videos/dec_vid1.mp4"></video>
      <video controls src="videos/dec_vid2.mp4"></video>
    </div>
  </div>

  <!-- JANUARY 2026 -->
  <div class="month-block">
    <div class="month-title">January 2026</div>
    <div class="media-grid">
      <img src="images/jan_img1.jpg" alt="">
      <img src="images/jan_img2.jpg" alt="">
      <video controls src="videos/jan_vid1.mp4"></video>
      <video controls src="videos/jan_vid2.mp4"></video>
    </div>
  </div>

  <!-- FEBRUARY 2026 -->
  <div class="month-block">
    <div class="month-title">February 2026</div>
    <div class="media-grid">
      <img src="images/feb_img1.jpg" alt="">
      <img src="images/feb_img2.jpg" alt="">
      <video controls src="videos/feb_vid1.mp4"></video>
      <video controls src="videos/feb_vid2.mp4"></video>
    </div>
  </div>

</div>

<!-- Footer -->
<footer class="site-footer">
  © 2025 Sisters Events Planners™ - our business in memory making.
</footer>

<script>
// Dark mode
const toggle = document.getElementById("themeSwitch");
toggle.addEventListener("change", () => {
  document.body.classList.toggle("dark-theme");
});

// Background slideshow
const slides = document.querySelectorAll(".slide");
let current = 0;
setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 3000);
</script>

</body>
</html>
