<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisters Events Planners — FAQ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body, html { height:100%; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; transition: background 0.3s, color 0.3s; }
body.dark-theme { background-color:#111; color:#f5d17a; }

/* Header */
.header-box {
  width:100%;
  background-color:#111;
  box-shadow:0 8px 25px rgba(0,0,0,0.7);
  position:relative;
  z-index:10;
  padding:1rem 0;
}
.header-content {
  max-width:1200px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.header-content img {
  max-width:200px;
  width:80%;
  border-radius:15px;
  margin-bottom:1rem;
}

/* Navigation */
.main-nav {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:1rem;
}
.main-nav .nav-link {
  color:#f5d17a; text-decoration:none;
  font-weight:600; padding:0.5rem 1rem;
  border-radius:10px; transition:all 0.3s;
}
.main-nav .nav-link.active,
.main-nav .nav-link:hover {
  color:#fff;
  background-color:rgba(245,209,122,0.2);
}

/* Theme toggle */
.theme-toggle { margin-left:10px; width:40px; height:20px; position:relative; display:inline-block; }
.theme-toggle input { display:none; }
.slider {
  position:absolute; cursor:pointer;
  top:0; left:0; right:0; bottom:0;
  background:#ccc; border-radius:34px; transition:0.4s;
}
.slider:before {
  position:absolute; content:"";
  height:16px; width:16px;
  left:2px; bottom:2px;
  background:white; border-radius:50%;
  transition:0.4s;
}
input:checked + .slider { background:#f5d17a; }
input:checked + .slider:before { transform:translateX(20px); }

/* Background Slideshow */
.slideshow {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  overflow:hidden; z-index:-1;
}
.slide {
  position:absolute; width:100%; height:100%;
  background-size:cover; background-position:center;
  opacity:0; transition:opacity 1s ease-in-out;
}
.slide.active { opacity:1; }

/* Content (Centered + Footer safe) */
.content {
  position:relative;
  z-index:10;
  margin-top: 8rem;      /* ensures footer is never touched */
  padding-bottom: 6rem;  /* space above footer */
  text-align:center;
  color:#f5d17a;
}
.content h1 { font-size:2rem; text-shadow:2px 2px 6px #111; }
.content p { font-size:1.2rem; margin-top:0.5rem; text-shadow:2px 2px 6px #111; }

/* Buttons */
.cta-row {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:1.5rem;
}
.btn {
  display:inline-block;
  padding:0.6rem 1.5rem;
  margin:0.5rem;
  font-weight:bold;
  border-radius:25px;
  transition:0.3s;
  text-decoration:none;
}
.btn-gold {
  background:#f5d17a;
  color:#111;
  border:2px solid #f5d17a;
}
.btn-gold:hover {
  background:transparent;
  color:#f5d17a;
}
.btn-outline {
  background:transparent;
  color:#f5d17a;
  border:2px solid #f5d17a;
}
.btn-outline:hover {
  background:#f5d17a;
  color:#111;
}

/* Footer */
.site-footer {
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(17,17,17,0.9);
  color:#f5d17a;
  text-align:center;
  padding:1rem 0;
  font-size:0.9rem;
  box-shadow:0 -3px 10px rgba(0,0,0,0.5);
}

/* Mobile */
@media(max-width:768px){
  .header-content img { max-width:150px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header-box">
  <div class="header-content">
    <img src="images/sisters.jpg" alt="Sisters Events Planners">
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="gallery.html" class="nav-link">Gallery</a>
      <a href="contact.html" class="nav-link">Contact</a>
      <a href="faq.html" class="nav-link active">FAQ</a>
      <label class="theme-toggle">
        <input type="checkbox" id="themeSwitch">
        <span class="slider"></span>
      </label>
    </nav>
  </div>
</div>

<!-- Slideshow -->
<div class="slideshow">
  <div class="slide active" style="background-image:url('images/img1.jpg');"></div>
  <div class="slide" style="background-image:url('images/img2.jpg');"></div>
  <div class="slide" style="background-image:url('images/img3.jpg');"></div>
  <div class="slide" style="background-image:url('images/img4.jpg');"></div>
</div>

<!-- Centered Content -->
<main class="content">
  <h1>Frequently Asked Questions</h1>
  <p>Find answers to common questions about our services and event planning.</p>

  <div class="cta-row">
    <a class="btn btn-gold" href="https://wa.me/27718403160" target="_blank">WhatsApp</a>
    <a class="btn btn-outline" href="mailto:sistersdecor379@gmail.com">Email Us</a>
  </div>
</main>

<!-- Footer -->
<footer class="site-footer">
  © 2025 Sisters Events Planners™ - our business in memory making.
</footer>

<script>
/* Dark theme toggle */
document.getElementById('themeSwitch').addEventListener('change', () => {
  document.body.classList.toggle('dark-theme');
});

/* Slideshow */
const slides = document.querySelectorAll('.slide');
let current = 0;
setInterval(() => {
  slides[current].classList.remove('active');
  current = (current + 1) % slides.length;
  slides[current].classList.add('active');
}, 3000);
</script>

</body>
</html>
