<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisters Events Planners — Contact</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body, html { height:100%; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
body.dark-theme { background-color:#111; color:#f5d17a; }

/* Header */
.header-box {
  width: 100%;
  background-color: #111;
  box-shadow: 0 8px 25px rgba(0,0,0,0.7);
  padding: 1rem 0;
  position: relative;
  z-index: 10;
}
.header-content {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.header-content img {
  max-width: 200px;
  border-radius: 15px;
  margin-bottom: 1rem;
}

/* Navigation */
.main-nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 1rem;
}
.nav-link {
  color: #f5d17a;
  text-decoration: none;
  font-weight: 600;
  padding: 0.5rem 1rem;
  border-radius: 10px;
  transition: 0.3s;
}
.nav-link.active,
.nav-link:hover {
  background-color: rgba(245,209,122,0.2);
  color: #fff;
}

/* Theme toggle */
.theme-toggle { width:40px; height:20px; position:relative; }
.theme-toggle input { display:none; }
.slider {
  position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0;
  background:#ccc; border-radius:34px; transition:0.4s;
}
.slider:before {
  content:""; position:absolute; height:16px; width:16px;
  left:2px; bottom:2px; background:white; border-radius:50%; transition:0.4s;
}
input:checked + .slider { background:#f5d17a; }
input:checked + .slider:before { transform:translateX(20px); }

/* Background slideshow */
.slideshow {
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  z-index:-1; overflow:hidden;
}
.slide {
  position:absolute; width:100%; height:100%;
  background-size:cover; background-position:center;
  opacity:0; transition:1s ease-in-out;
}
.slide.active { opacity:1; }

/* Contact Content */
.content {
  position: relative;
  z-index: 10;
  text-align: center;
  margin-top: 10rem;
  padding-bottom: 5rem;
  color: #f5d17a;
}
.content p {
  font-size:1.3rem;
  margin:1.2rem 0;
  text-shadow:2px 2px 6px #000;
}
.content a { color:#fff; text-decoration:none; }

/* Footer */
.site-footer {
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(17,17,17,0.9);
  color:#f5d17a;
  text-align:center;
  padding:1rem 0;
  font-size:0.9rem;
  box-shadow:0 -3px 10px rgba(0,0,0,0.5);
}

/* Responsive */
@media(max-width:768px){
  .header-content img { max-width:150px; }
  .content { margin-top:8rem; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header-box">
  <div class="header-content">
    <img src="images/sisters.jpg" alt="Sisters Events Planners">
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="gallery.html" class="nav-link">Gallery</a>
      <a href="contact.html" class="nav-link active">Contact</a>
      <a href="faq.html" class="nav-link">FAQ</a>

      <label class="theme-toggle">
        <input type="checkbox" id="themeSwitch">
        <span class="slider"></span>
      </label>
    </nav>
  </div>
</div>

<!-- Slideshow -->
<div class="slideshow">
  <div class="slide active" style="background-image:url('images/img1.jpg');"></div>
  <div class="slide" style="background-image:url('images/img2.jpg');"></div>
  <div class="slide" style="background-image:url('images/img3.jpg');"></div>
  <div class="slide" style="background-image:url('images/img4.jpg');"></div>
</div>

<!-- Contact Content (Centered, No Buttons) -->
<main class="content">
  <p><strong>Address:</strong><br>723 Manana Street, Katlehong 1431</p>
  <p><strong>Email:</strong><br>sistersdecor379@gmail.com</p>
  <p><strong>WhatsApp:</strong><br>071 840 3160</p>
</main>

<!-- Footer -->
<footer class="site-footer">
  © 2025 Sisters Events Planners™ - our business in memory making.
</footer>

<script>
/* Dark theme toggle */
document.getElementById('themeSwitch').addEventListener('change', () => {
  document.body.classList.toggle('dark-theme');
});

/* Slideshow */
const slides = document.querySelectorAll('.slide');
let current = 0;
setInterval(() => {
  slides[current].classList.remove('active');
  current = (current + 1) % slides.length;
  slides[current].classList.add('active');
}, 3000);
</script>

</body>
</html>
